{% extends "layouts.html" %}  
{% comment %} extending our layout html {% endcomment %}
{% block title%}
    Login
{%endblock %}

{% block content%}
    <h1>User Login</h1>
        <form class=""action="/users/login/" method="post">
            {% csrf_token %}
            {{form}}
            {% if request.GET.next %}
            <input type="hidden" name="next", value="{{ request.GET.next}}">
            {% endif %}
        <button>Submit</button>
    </form>
{%endblock %}
